<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SO 05 – 3D model</title>
<meta name="description" content="Verde Slaný II, bytový dům SO 05 – 3D model podle projektové dokumentace (ilustrační), s okolím a procházkou.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --zelena: #435955;
    --seda: #a6aba9;
    --bila: #ffffff;
    --text: #1f2a28;
    --panel: rgba(255, 255, 255, 0.92);
    --nebe-hore: #8fb4d9;
    --nebe-dole: #e9eef1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: rgba(255, 255, 255, 0.92); }
  }
  :root[data-theme="dark"] { --panel: rgba(255, 255, 255, 0.92); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Exo 2', system-ui, sans-serif; color: var(--text);
    background: linear-gradient(180deg, var(--nebe-hore) 0%, var(--nebe-dole) 62%, #dfe4e2 100%);
    -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #scena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hlavicka {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
  }
  .nazev {
    background: var(--zelena); color: var(--bila); padding: 8px 12px; border-left: 4px solid var(--bila);
    font-weight: 600; font-size: 15px; line-height: 1.2; box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  .nazev small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  .stitek {
    background: var(--panel); color: var(--zelena); padding: 6px 10px;
    font-size: 11px; line-height: 1.25; max-width: 190px; text-align: right; box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  .panel {
    position: fixed; left: 16px; right: 16px; bottom: max(14px, env(safe-area-inset-bottom));
    margin: 0 auto; max-width: 560px; background: var(--panel); border-radius: 14px; padding: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18); backdrop-filter: blur(6px);
  }
  .rezimy, .akce { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .akce { grid-template-columns: 1.6fr 1fr; margin-top: 6px; }
  .panel button {
    font: inherit; font-size: 13px; font-weight: 600; border: 1.5px solid var(--zelena); color: var(--zelena);
    background: var(--bila); border-radius: 9px; padding: 8px 6px; min-height: 44px; line-height: 1.1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .panel button[aria-pressed="true"], .panel button.plny { background: var(--zelena); color: var(--bila); }
  .panel button svg { flex: none; }
  .rust { margin-top: 10px; display: none; }
  .rust.vid { display: block; }
  .rust-radek { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--zelena); }
  .rust-radek b { font-size: 15px; }
  input[type=range] { width: 100%; margin: 8px 0 2px; accent-color: var(--zelena); height: 28px; }
  .stupnice { display: flex; justify-content: space-between; font-size: 10px; color: #6d7472; }
  .napoveda { font-size: 11px; color: #6d7472; text-align: center; margin-top: 6px; line-height: 1.35; }
  .chuze-lista { display: none; }
  body.chuze .orbit-jen { display: none !important; }
  body.chuze .chuze-lista { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  body.chuze .panel { max-width: 420px; }
  #nacitani {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; color: var(--zelena); font-weight: 600; background: rgba(233,238,241,.75); text-align: center; padding: 16px;
  }
  .lista { width: min(260px, 70vw); height: 6px; background: var(--seda); border-radius: 3px; overflow: hidden; }
  .lista i { display: block; height: 100%; width: 0; background: var(--zelena); transition: width .2s; }
  #nacitani.chyba { color: #8a2b22; }
  .skryt { display: none !important; }

  /* odznak „Projít se“ nad panáčkem na parkovišti (jen v nadhledu) */
  .odznak {
    position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer;
    background: var(--zelena); color: var(--bila); border: 0; border-left: 4px solid var(--bila); font: inherit; font-weight: 600;
    font-size: 13px; padding: 7px 11px 7px 8px; display: flex; align-items: center; gap: 7px; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
  }
  .odznak::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--zelena); }

  /* kompas nahoře při chůzi */
  .kompas {
    position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 56px)); left: 50%; transform: translateX(-50%);
    width: min(320px, 70vw); height: 34px; overflow: hidden; background: rgba(67,89,85,.86); color: var(--bila);
    border-left: 4px solid var(--bila); display: none; pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  }
  body.chuze .kompas { display: block; }
  .kompas-pas { position: absolute; top: 0; left: 0; height: 100%; white-space: nowrap; will-change: transform; }
  .kompas-pas span { position: absolute; top: 0; height: 100%; transform: translateX(-50%); font-size: 12px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; letter-spacing: .04em; }
  .kompas-pas span.hl { font-size: 15px; }
  .kompas-pas span.tick { width: 1px; padding: 0; }
  .kompas-pas span.tick::before { content: ''; display: block; width: 1px; height: 7px; background: rgba(255,255,255,.55); margin-bottom: 4px; }
  .kompas-stred { position: absolute; left: 50%; top: 0; width: 2px; height: 9px; margin-left: -1px; background: var(--seda); }
  .kompas-stupne { position: fixed; top: max(100px, calc(env(safe-area-inset-top) + 92px)); left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--bila); text-shadow: 0 1px 3px rgba(0,0,0,.6); display: none; pointer-events: none; }
  body.chuze .kompas-stupne { display: block; }
  body.chuze .stitek { display: none; }
  @media (max-width: 600px) {
    .kompas { top: calc(max(12px, env(safe-area-inset-top)) + 78px); }
    .kompas-stupne { top: calc(max(12px, env(safe-area-inset-top)) + 116px); }
    .vstup { left: auto; right: 12px; transform: none; max-width: 205px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 104px); }
  }

  /* joystick (dotyk) */
  .joy { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 92px);
    width: 124px; height: 124px; border-radius: 50%; background: rgba(67,89,85,.30); border: 2px solid rgba(255,255,255,.75);
    display: none; touch-action: none; }
  body.chuze.dotyk .joy { display: block; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: var(--zelena); border: 3px solid var(--bila); box-shadow: 0 4px 12px rgba(0,0,0,.3); }

  /* vstup do bytu u dveří */
  .vstup { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 96px);
    background: var(--zelena); color: var(--bila); border: 0; border-left: 5px solid var(--bila); font: inherit; cursor: pointer;
    padding: 10px 16px 10px 12px; display: none; align-items: center; gap: 10px; text-align: left; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .vstup b { display: block; font-size: 16px; letter-spacing: .05em; }
  .vstup small { display: block; font-size: 12px; opacity: .9; }
  .vstup.vid { display: flex; }
  .vstup img { width: 30px; height: 30px; }

  /* prohlídka bytu přes celé okno */
  #byt { position: fixed; inset: 0; background: #0d1412; opacity: 0; transition: opacity .45s; z-index: 20; }
  #byt.vid { opacity: 1; }
  #byt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* levý okraj uprostřed: prohlídka bytu tam nemá žádné ovládání (nahoře karta a přepínače, dole lišta a joystick) */
  #bytZpet { position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 2; font: inherit; font-weight: 600;
    font-size: 14px; background: var(--zelena); color: var(--bila); border: 0; border-left: 4px solid var(--bila); padding: 12px 14px 12px 10px;
    border-radius: 0 10px 10px 0; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  #prechod { position: fixed; inset: 0; background: #0d1412; opacity: 0; pointer-events: none; transition: opacity .45s; z-index: 19; }
  #prechod.vid { opacity: 1; }
</style>
</head>
<body>
<canvas id="scena" tabindex="0" aria-label="3D model bytového domu SO 05 s okolím"></canvas>

<div class="hlavicka">
  <div class="nazev">SO 05 · Verde Slaný II<small>bytový dům, 2. etapa</small></div>
  <div class="stitek">3D model podle projektové dokumentace a areálové situace – ilustrační</div>
</div>

<div class="kompas" aria-hidden="true"><div class="kompas-pas" id="kompasPas"></div><div class="kompas-stred"></div></div>
<div class="kompas-stupne" id="kompasText" aria-live="off"></div>

<button class="odznak skryt" id="odznak" type="button" aria-label="Projít se kolem domu – začít na parkovišti">
  <svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><circle cx="9" cy="3.4" r="2.6" fill="#fff"/><path d="M9 7.2c-2.2 0-3.6 1.4-3.6 3.4v4.2h1.7V21h3.8v-6.2h1.7v-4.2c0-2-1.4-3.4-3.6-3.4z" fill="#fff"/></svg>
  Projít se odsud
</button>

<div class="panel" role="group" aria-label="Zobrazení modelu">
  <div class="rezimy orbit-jen">
    <button type="button" data-rezim="hotovy" aria-pressed="true">Hotový dům</button>
    <button type="button" data-rezim="hruba" aria-pressed="false">Hrubá stavba</button>

  </div>
  <div class="rust orbit-jen" id="rust">
    <div class="rust-radek"><span>Podlaží</span><b id="rustText">1. PP</b></div>
    <input type="range" id="rustSlider" min="0" max="6" step="1" value="0" aria-label="Růst po podlažích">
    <div class="stupnice"><span>1PP</span><span>1NP</span><span>2NP</span><span>3NP</span><span>4NP</span><span>5NP</span><span>hotovo</span></div>
  </div>
  <div class="akce orbit-jen">
    <button type="button" id="btnChuze" class="plny" aria-label="Projít se kolem domu jako chodec">
      <svg width="20" height="24" viewBox="0 0 18 22" aria-hidden="true"><circle cx="9" cy="3.4" r="2.6" fill="currentColor"/><path d="M9 7.2c-2.2 0-3.6 1.4-3.6 3.4v4.2h1.7V21h3.8v-6.2h1.7v-4.2c0-2-1.4-3.4-3.6-3.4z" fill="currentColor"/></svg>
      Projít se kolem domu
    </button>
    <button type="button" class="btnNoc" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg><span>Noc</span></button>
  </div>
  <div class="chuze-lista">
    <button type="button" id="btnZpet">← Zpět na model</button>
    <button type="button" class="btnNoc" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg><span>Noc</span></button>
  </div>
  <div class="napoveda" id="napoveda">Otáčení jedním prstem · přiblížení dvěma prsty</div>
</div>

<div class="joy" id="joy" aria-hidden="true"><i id="joyKnob"></i></div>
<button class="vstup" id="vstup" type="button"><img src="verde_symbol.png" alt=""><span><b>VSTOUPIT DO BYTU</b><small>Typový byt 3+kk, 3. NP · 3D prohlídka</small></span></button>

<div id="prechod"></div>
<div id="byt" class="skryt" role="dialog" aria-label="3D prohlídka bytu"><button id="bytZpet" type="button">← Zpět ven</button></div>

<div id="nacitani"><div id="nacitaniText">Načítám 3D model…</div><div class="lista"><i id="lista"></i></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || 'so05-glb.webm';
const PROHLIDKA = params.get('prohlidka') || '../prohlidka-byt/';     // 3D prohlídka typového bytu (podsložka Petrovy stránky)
const DOTYK = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (DOTYK) document.body.classList.add('dotyk');
const canvas = document.getElementById('scena');
const nac = document.getElementById('nacitani');
const nacText = document.getElementById('nacitaniText');
const lista = document.getElementById('lista');
const DEG = Math.PI / 180;

function chyba(msg) {
  nac.classList.remove('skryt'); nac.classList.add('chyba');
  nacText.textContent = msg; lista.parentElement.classList.add('skryt');
}

// ---------------------------------------------------------------- souřadnice
// místní rám scena.json: X = východ, Y = sever mřížky S-JTSK (m); svět prohlížeče = (X, výška, −Y); ±0,00 domu = 0
const ZEM_Y = -0.17;
const OSA_U = [-0.345832, 0.938297], OSA_V = [-0.938297, -0.345832];       // osy domu SO 05 (u podél domu, v k ZJZ)
const KONV = 8.134;                    // sever mřížky S-JTSK je u Slaného o 8,1° vlevo od skutečného severu (pyproj, EPSG:5514 → 4326)
const SEVER = new THREE.Vector3(Math.sin(KONV * DEG), 0, -Math.cos(KONV * DEG));
const VYCHOD = new THREE.Vector3(Math.cos(KONV * DEG), 0, Math.sin(KONV * DEG));
const xyW = (X, Y, h = 0) => new THREE.Vector3(X, h, -Y);
const uvW = (u, v, h = 0) => xyW(u * OSA_U[0] + v * OSA_V[0], u * OSA_U[1] + v * OSA_V[1], h);
const U_W = new THREE.Vector3(OSA_U[0], 0, -OSA_U[1]), V_W = new THREE.Vector3(OSA_V[0], 0, -OSA_V[1]);
const rotNa = (n) => Math.atan2(n.x, n.z);                                 // rotace kolem Y, aby +Z rovina hleděla směrem n

// ---------------------------------------------------------------- renderer, kamera
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
} catch (e) {
  chyba('Tento prohlížeč nepodporuje 3D zobrazení (WebGL). Zkuste prosím jiný prohlížeč.');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 2000);
camera.position.set(-62, 44, 66);
const controls = new OrbitControls(camera, canvas);
controls.target.set(-12, 4, -2);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 10; controls.maxDistance = 260;
controls.maxPolarAngle = THREE.MathUtils.degToRad(87);
controls.screenSpacePanning = true;
controls.update();

// ---------------------------------------------------------------- obloha (den ↔ noc), odrazy, mlha
const U_NOC = { value: 0 };                                // 0 den … 1 noc, sdílí ho obloha, okna, lampy i cedule
const azS = 160 * DEG, elS = 36 * DEG;                     // slunce od JJV (stejné jako pečené stíny v podkladu okolí)
const SLUNCE = new THREE.Vector3(Math.sin(azS) * Math.cos(elS), Math.sin(elS), -Math.cos(azS) * Math.cos(elS));
const azM = (143 + KONV) * DEG, elM = 41 * DEG;           // měsíc jako v Lužinách: 41° nad obzorem, azimut 143° (JV)
const MESIC = new THREE.Vector3(Math.sin(azM) * Math.cos(elM), Math.sin(elM), -Math.cos(azM) * Math.cos(elM));
const PRAHA = new THREE.Vector3(Math.sin((112 + KONV) * DEG), 0, -Math.cos((112 + KONV) * DEG));   // záře Prahy na obzoru (VJV)

const pmrem = new THREE.PMREMGenerator(renderer);
const skyScene = new THREE.Scene();
skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'varying vec3 vP; void main(){ float h = vP.y; vec3 top = vec3(0.30,0.52,0.82); vec3 hor = vec3(0.86,0.90,0.93); vec3 gnd = vec3(0.30,0.33,0.28); vec3 c = h>0.0 ? mix(hor, top, pow(h,0.6)) : mix(hor, gnd, pow(-h,0.4)); gl_FragColor = vec4(c,1.0); }'
})));
scene.environment = pmrem.fromScene(skyScene, 0.02).texture;

// viditelná obloha: barvy přímo ve výstupu (bez tónování), obzor = barva mlhy, v noci hvězdy, měsíc a záře Prahy
const BARVY = {
  denTop: [0.43, 0.62, 0.84], denHor: [0.875, 0.902, 0.918],
  nocTop: [0.012, 0.024, 0.065], nocHor: [0.075, 0.115, 0.20],
};
const dome = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uNoc: U_NOC, uSlunce: { value: SLUNCE }, uMesic: { value: MESIC }, uPraha: { value: PRAHA },
    dT: { value: new THREE.Vector3(...BARVY.denTop) }, dH: { value: new THREE.Vector3(...BARVY.denHor) },
    nT: { value: new THREE.Vector3(...BARVY.nocTop) }, nH: { value: new THREE.Vector3(...BARVY.nocHor) },
  },
  vertexShader: 'varying vec3 vD; void main(){ vD = position; vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position = p.xyww; }',
  fragmentShader: `
    uniform float uNoc; uniform vec3 uSlunce, uMesic, uPraha, dT, dH, nT, nH; varying vec3 vD;
    float h31(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    void main(){
      vec3 d = normalize(vD); float h = d.y;
      vec3 den = mix(dH, dT, pow(clamp(h, 0.0, 1.0), 0.55));
      float s = max(dot(d, uSlunce), 0.0);
      den += vec3(1.0, 0.96, 0.86) * (pow(s, 900.0) * 1.2 + pow(s, 14.0) * 0.12);
      vec3 noc = mix(nH, nT, pow(clamp(h, 0.0, 1.0), 0.45));
      float lp = pow(max(dot(normalize(vec3(d.x, 0.0, d.z) + 1e-5), uPraha), 0.0), 2.0) * exp(-max(h, 0.0) * 10.0);
      noc += vec3(0.20, 0.13, 0.08) * lp * 0.55;
      float m = max(dot(d, uMesic), 0.0);
      noc += vec3(0.92, 0.95, 1.0) * smoothstep(0.99988, 0.99993, m) + vec3(0.55, 0.62, 0.8) * pow(m, 90.0) * 0.10;
      vec3 q = d * 230.0; vec3 g = floor(q); float st = h31(g); float r = length(fract(q) - 0.5);
      float hv = step(0.9962, st) * smoothstep(0.32, 0.0, r) * (0.35 + 0.65 * h31(g + 7.0)) * smoothstep(0.03, 0.3, h);
      noc += vec3(0.85, 0.9, 1.0) * hv;
      vec3 c = mix(den, noc, uNoc);
      if (h < 0.0) c = mix(dH, nH, uNoc);
      gl_FragColor = vec4(c, 1.0);
    }`,
}));
dome.renderOrder = -10; dome.frustumCulled = false;
scene.add(dome);
const mlhaDen = new THREE.Color().setRGB(...BARVY.denHor, THREE.LinearSRGBColorSpace);   // mlha se míchá až do výstupu → stejná čísla jako obzor
const mlhaNoc = new THREE.Color().setRGB(...BARVY.nocHor, THREE.LinearSRGBColorSpace);
scene.fog = new THREE.Fog(mlhaDen.clone(), 180, 900);

// ---------------------------------------------------------------- světla
const hemi = new THREE.HemisphereLight(0xdfeaf5, 0x5d6650, 0.55);
scene.add(hemi);

function zemMaterial(base, splat) {

    Object.assign(sh.uniforms, U_ZEM, { tBase: { value: base }, tSplat: { value: splat }, uMaSplat: { value: base ? 1 : 0 } });
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vW;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vW; uniform sampler2D tAsf, tZat, tDla, tTra, tBase, tSplat; uniform float uMaSplat; uniform vec4 uRam;
      float gH, gR;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
      float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
      vec3 zemBump(vec3 sp, vec3 sn, vec2 dH, float fd){
        vec3 sx = dFdx(sp), sy = dFdy(sp); vec3 r1 = cross(sy, sn), r2 = cross(sn, sx);
        float det = dot(sx, r1) * fd; vec3 gr = sign(det) * (dH.x * r1 + dH.y * r2);
        return normalize(abs(det) * sn - gr); }`)
      .replace('#include <map_fragment>', `
      vec2 p = vec2(vW.x, -vW.z);
      vec2 uvR = vec2((p.x - uRam.x) / (uRam.y - uRam.x), (p.y - uRam.z) / (uRam.w - uRam.z));
      vec4 w = vec4(0.0, 0.0, 1.0, 0.0); vec3 base = vec3(0.0);
      if (uMaSplat > 0.5 && uvR.x > 0.0 && uvR.x < 1.0 && uvR.y > 0.0 && uvR.y < 1.0) { w = texture2D(tSplat, uvR); base = texture2D(tBase, uvR).rgb; }

      float mac = mix(0.84, 1.16, vn(p * 0.09) * 0.65 + vn(p * 0.31) * 0.35);

function zarOken(m, sila) {
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uNoc = U_NOC; sh.uniforms.uSila = { value: sila };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWo;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWo = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWo; uniform float uNoc, uSila;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      {
        float Xl = vWo.x, Yl = -vWo.z;
        float u = Xl * ${OSA_U[0]} + Yl * ${OSA_U[1]};
        float v = Xl * ${OSA_V[0]} + Yl * ${OSA_V[1]};
        float fl = floor((vWo.y + 0.25) / 3.25);
        vec2 cell = vec2(floor(u / 2.6), fl) + step(0.0, v) * 31.0;
        float h1 = fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453);
        float h2 = fract(h1 * 7.31 + 0.13);
        float jadro = step(3.071, u) * step(u, 5.586);
        float lit = max(step(h1, 0.42), jadro) * step(-0.5, fl);
        float zap = smoothstep(h2 * 0.55, h2 * 0.55 + 0.25, uNoc);
        vec3 c = mix(vec3(1.0, 0.70, 0.40), vec3(0.80, 0.87, 1.0), step(0.9, h2));
        if (jadro > 0.5) c = vec3(0.95, 0.92, 0.84) * 0.45;
        totalEmissiveRadiance += c * lit * zap * uSila;
      }`);
  };
  m.needsUpdate = true;
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.focus({ preventScroll: true });
  tah = { id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now(), pohnul: false };
  if (stav === 'chuze') canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!tah || tah.id !== e.pointerId) return;
  const dx = e.clientX - tah.x, dy = e.clientY - tah.y; tah.x = e.clientX; tah.y = e.clientY;
  if (Math.hypot(e.clientX - tah.x0, e.clientY - tah.y0) > 6) tah.pohnul = true;
  if (stav === 'chuze') {
    const k = DOTYK ? 0.0055 : 0.0038;
    hrac.yaw += dx * k; hrac.pitch = THREE.MathUtils.clamp(hrac.pitch + dy * k, -1.25, 1.2);
    if (tah.pohnul) hrac.cil = null;
  }
});
canvas.addEventListener('pointerup', (e) => {
  if (!tah || tah.id !== e.pointerId) return;
  const klik = !tah.pohnul && performance.now() - tah.t < 450; tah = null;
  if (klik) kliknuti(e.clientX, e.clientY);
});
canvas.addEventListener('pointercancel', () => { tah = null; });
function kliknuti(x, y) {
  const r = canvas.getBoundingClientRect();
  mys.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mys, camera);
  const hd = ray.intersectObjects(pickDvere, false)[0];
  if (hd && (stav === 'orbit' || hd.distance < 30)) { otevriByt(hd.object.userData.dvere); return; }
  if (stav === 'orbit' && panacek && panacek.visible) {
    const hp = ray.intersectObject(panacek, true)[0];
    if (hp) { zacniChuzi(); return; }
  }
  if (stav !== 'chuze') return;
  const cil = [okoli, ground]; if (dumRoot) cil.unshift(dumRoot);
  const h = ray.intersectObjects(cil, true)[0];
  if (h && (h.object === okoli || h.object === ground) && h.distance < 120) hrac.cil = new THREE.Vector3(h.point.x, 0, h.point.z);
}
window.addEventListener('keydown', (e) => {
  if (stav !== 'chuze') return;
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift'].includes(k)) { klavesy.add(k); hrac.cil = null; e.preventDefault(); }
  if ((k === 'e' || k === 'enter') && blizkeDvere) otevriByt(blizkeDvere);
  if (k === 'escape') konecChuze();
});
window.addEventListener('keyup', (e) => klavesy.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => klavesy.clear());

// joystick
const joyEl = document.getElementById('joy'), joyKnob = document.getElementById('joyKnob');
joyEl.addEventListener('pointerdown', (e) => { joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); hrac.cil = null; joyPohyb(e); e.stopPropagation(); });
joyEl.addEventListener('pointermove', (e) => { if (e.pointerId === joy.id) joyPohyb(e); });
const joyKonec = (e) => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; joyKnob.style.transform = ''; };
joyEl.addEventListener('pointerup', joyKonec); joyEl.addEventListener('pointercancel', joyKonec);
function joyPohyb(e) {
  const r = joyEl.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R); const d = Math.hypot(dx, dy), m = R * 0.62;
  if (d > m) { dx *= m / d; dy *= m / d; }
  joy.x = dx / m; joy.y = dy / m; joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}

// kolize: hráč = kruh 0,3 m; dům, terasy, auta (natočené obdélníky), stromy a lampy (kruhy), okraj okolí
const RH = 0.3;
const tmp = new THREE.Vector3();
function vysunZ(p) {
  for (let it = 0; it < 3; it++) {
    for (const o of [...kolizeDum, ...kolizeAuta]) {
      tmp.subVectors(p, o.c); tmp.y = 0;
      const la = tmp.dot(o.a), lb = tmp.dot(o.b);
      if (Math.abs(la) > o.ha + RH || Math.abs(lb) > o.hb + RH) continue;
      const ca = THREE.MathUtils.clamp(la, -o.ha, o.ha), cb = THREE.MathUtils.clamp(lb, -o.hb, o.hb);
      let da = la - ca, db = lb - cb; const d = Math.hypot(da, db);
      if (d > 1e-6) { if (d >= RH) continue; const k = (RH - d) / d; p.addScaledVector(o.a, da * k).addScaledVector(o.b, db * k); }
      else {                                                // uvnitř: ven nejkratší cestou
        const pa = o.ha - Math.abs(la) + RH, pb = o.hb - Math.abs(lb) + RH;
        if (pa < pb) p.addScaledVector(o.a, Math.sign(la || 1) * pa); else p.addScaledVector(o.b, Math.sign(lb || 1) * pb);
      }
    }
    for (const k of kolizeKruhy) {
      const dx = p.x - k.x, dz = p.z - k.z, d = Math.hypot(dx, dz), m = k.r + RH;
      if (d < m && d > 1e-6) { p.x = k.x + dx / d * m; p.z = k.z + dz / d * m; }
    }
  }
  p.x = THREE.MathUtils.clamp(p.x, OKOLI.x0 + 2, OKOLI.x1 - 2);
  p.z = THREE.MathUtils.clamp(p.z, -(OKOLI.y1 - 2), -(OKOLI.y0 + 2));
}

// kompas nahoře: pás se světovými stranami posouvaný podle směru pohledu (ke skutečnému severu)
const kompasPas = document.getElementById('kompasPas'), kompasText = document.getElementById('kompasText');
const PX_STUPEN = 2.4;
(() => {
  const STR = { 0: 'S', 45: 'SV', 90: 'V', 135: 'JV', 180: 'J', 225: 'JZ', 270: 'Z', 315: 'SZ' };
  let h = '';
  for (let a = -360; a <= 720; a += 15) {
    const n = ((a % 360) + 360) % 360, x = a * PX_STUPEN;
    if (STR[n] !== undefined) h += `<span class="${n % 90 === 0 ? 'hl' : ''}" style="left:${x}px">${STR[n]}</span>`;
    else h += `<span class="tick" style="left:${x}px"></span>`;
  }
  kompasPas.innerHTML = h;
})();
const NAZ_SM = ['sever', 'severovýchod', 'východ', 'jihovýchod', 'jih', 'jihozápad', 'západ', 'severozápad'];
function aktualizujKompas() {
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); f.y = 0; f.normalize();
  const az = ((Math.atan2(f.dot(VYCHOD), f.dot(SEVER)) / DEG) + 360) % 360;
  const w = kompasPas.parentElement.clientWidth;
  kompasPas.style.transform = `translateX(${w / 2 - az * PX_STUPEN}px)`;
  kompasText.textContent = `${Math.round(az)}° · ${NAZ_SM[Math.round(az / 45) % 8]}`;
}

// ---------------------------------------------------------------- prohlídka bytu (vstup u dveří)
const vstupBtn = document.getElementById('vstup');
const bytEl = document.getElementById('byt'), prechod = document.getElementById('prechod');
let blizkeDvere = null, bytOtevren = false, bytDvere = null;
vstupBtn.addEventListener('click', () => { if (blizkeDvere) otevriByt(blizkeDvere); });
function otevriByt(d) {
  if (bytOtevren) return;
  bytOtevren = true; bytDvere = d; klavesy.clear();
  prechod.classList.add('vid');
  setTimeout(() => {
    const f = document.createElement('iframe');
    f.title = '3D prohlídka – Typový byt 3+kk, 3. NP'; f.allow = 'fullscreen; xr-spatial-tracking'; f.src = PROHLIDKA;
    bytEl.appendChild(f); bytEl.classList.remove('skryt');
    requestAnimationFrame(() => { bytEl.classList.add('vid'); prechod.classList.remove('vid'); });
    setTimeout(() => { try { f.focus(); } catch (e) { /* jiný původ */ } }, 600);
  }, 450);
}
document.getElementById('bytZpet').addEventListener('click', () => {
  bytEl.classList.remove('vid');
  setTimeout(() => {
    bytEl.classList.add('skryt'); bytEl.querySelector('iframe')?.remove(); bytOtevren = false;
    if (bytDvere) {                                                      // zpátky venku před dveřmi, čelem od domu
      const d = bytDvere; const p = d.bod.clone().addScaledVector(d.n, 1.2);
      if (stav === 'chuze') { hrac.p.copy(p); hrac.yaw = Math.atan2(-d.n.x, -d.n.z); hrac.pitch = -0.05; hrac.cil = null; }
      else if (stav === 'orbit') zacniChuzi(p, Math.atan2(-d.n.x, -d.n.z));
    }
    canvas.focus({ preventScroll: true });
  }, 450);
});

// ---------------------------------------------------------------- velikost okna
function fovOrbit() { return window.innerWidth < 600 ? 50 : 38; }
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (stav === 'orbit') camera.fov = fovOrbit();
  camera.updateProjectionMatrix();
  if (!uzivatelOtocil && stav === 'orbit') {
    // dům i parkoviště (≈ 75 m na šířku) se vejdou i na úzký displej
    const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
    const d = Math.max(110, 40 / Math.tan(hfov / 2));
    const dir = new THREE.Vector3(-62, 40, 66).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, d);
    controls.update();
  }
}
let uzivatelOtocil = false;
controls.addEventListener('start', () => { uzivatelOtocil = true; });
window.addEventListener('resize', resize);
resize();
postavZnaceni();
if (params.get('ladit') === '1') window.__verde = { THREE, camera, controls, hrac, scene, renderer, zacniChuzi, konecChuze, aplikujNoc, get stav() { return stav; } };

// ---------------------------------------------------------------- smyčka
const hodiny = new THREE.Clock();
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const promit = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(hodiny.getDelta(), 0.05);
  const ted = performance.now();
  if (bytOtevren && bytEl.classList.contains('vid')) return;          // uvnitř bytu se venek nekreslí
  if (noc !== nocCil) {
    const t = Math.min(1, (ted - nocT0) / NOC_TRVANI);
    noc = THREE.MathUtils.lerp(nocOd, nocCil, t); if (t >= 1) noc = nocCil;
    aplikujNoc(noc);
  }
  if (stav === 'orbit') controls.update();
  else if (stav === 'prelet') {
    const t = Math.min(1, (ted - prelet.t0) / prelet.dur), e = ease(t);
    camera.position.lerpVectors(prelet.p0, prelet.p1, e);
    if (prelet.cil === 'chuze') camera.position.y += Math.sin(e * Math.PI) * 6;
    camera.quaternion.slerpQuaternions(prelet.q0, prelet.q1, e);
    camera.fov = THREE.MathUtils.lerp(prelet.fov0, prelet.fov1, e); camera.near = prelet.cil === 'chuze' ? THREE.MathUtils.lerp(0.5, 0.06, e) : 0.5;
    camera.updateProjectionMatrix();
    if (t >= 1) {
      stav = prelet.cil; prelet = null;
      if (stav === 'orbit') { controls.enabled = true; controls.update(); if (panacek) panacek.visible = true; }
    }
  } else if (stav === 'chuze') {
    // chůze: zrychlení a dobrzdění, běh se Shiftem, krok do cíle po kliknutí
    const vp = new THREE.Vector3(-Math.sin(hrac.yaw), 0, -Math.cos(hrac.yaw)), bok = new THREE.Vector3(Math.cos(hrac.yaw), 0, -Math.sin(hrac.yaw));
    let fx = 0, fz = 0;
    if (klavesy.has('w') || klavesy.has('arrowup')) fz += 1;
    if (klavesy.has('s') || klavesy.has('arrowdown')) fz -= 1;
    if (klavesy.has('d')) fx += 1;
    if (klavesy.has('a')) fx -= 1;
    if (klavesy.has('arrowleft')) hrac.yaw += 1.9 * dt;
    if (klavesy.has('arrowright')) hrac.yaw -= 1.9 * dt;
    if (joy.id !== null) { fz -= joy.y; fx += joy.x; }
    const chce = new THREE.Vector3().addScaledVector(vp, fz).addScaledVector(bok, fx);
    let rych = klavesy.has('shift') ? 4.2 : 1.9;
    if (hrac.cil && chce.lengthSq() < 1e-4) {
      tmp.subVectors(hrac.cil, hrac.p); tmp.y = 0; const d = tmp.length();
      if (d < 0.25) hrac.cil = null; else { chce.copy(tmp).normalize(); rych = Math.min(2.4, 0.8 + d); }
    }
    if (chce.lengthSq() > 1) chce.normalize();
    const cilV = chce.multiplyScalar(rych);
    hrac.v.lerp(cilV, 1 - Math.exp(-dt * 9));
    const pred = hrac.p.clone();
    hrac.p.addScaledVector(hrac.v, dt);
    vysunZ(hrac.p);
    const ujel = Math.hypot(hrac.p.x - pred.x, hrac.p.z - pred.z);
    if (hrac.cil && ujel < 0.15 * dt && hrac.v.length() > 0.5) hrac.cil = null;     // narazil – nečekat
    hrac.krok += ujel * 1.9;
    const houp = Math.sin(hrac.krok * Math.PI) * 0.028 * Math.min(1, hrac.v.length() / 1.5);
    camera.position.set(hrac.p.x, ZEM_Y + OCI + houp, hrac.p.z);
    camera.quaternion.copy(kvatOd(hrac.yaw, hrac.pitch));
    if (camera.fov !== 70) { camera.fov = 70; camera.updateProjectionMatrix(); }
    aktualizujKompas();
    // blízko dveří: tlačítko Vstoupit
    blizkeDvere = null;
    for (const d of DVERE) if (d.bod && Math.hypot(d.bod.x - hrac.p.x, d.bod.z - hrac.p.z) < 3.6) blizkeDvere = d;
    vstupBtn.classList.toggle('vid', !!blizkeDvere);
  }
  // stíny: v nadhledu celé okolí, při chůzi ostřeji kolem hráče
  if (stav === 'chuze') nastavStin(hrac.p, 34); else nastavStin(STIN_ORBIT.c, STIN_ORBIT.r);
  // pulz značek u dveří
  const tt = hodiny.elapsedTime;
  for (const d of DVERE) if (d.kruh) { const s = 1 + Math.sin(tt * 2.4) * 0.06; d.kruh.scale.set(s, s, 1); d.pap.material.opacity = 0.22 + 0.1 * Math.sin(tt * 2.4) + 0.2 * U_NOC.value; }
  // odznak nad panáčkem
  if (stav === 'orbit' && panacek && panacek.visible && okoliGrp.visible) {
    promit.copy(panacek.position).setY(ZEM_Y + 2.3).project(camera);
    const vid = promit.z < 1 && Math.abs(promit.x) < 1.1 && Math.abs(promit.y) < 1.1;
    odznak.classList.toggle('skryt', !vid);
    if (vid) odznak.style.transform = `translate(${(promit.x * 0.5 + 0.5) * window.innerWidth}px, ${(-promit.y * 0.5 + 0.5) * window.innerHeight - 8}px) translate(-50%, -100%)`;
  } else odznak.classList.add('skryt');
  dome.position.copy(camera.position);
  renderer.render(scene, camera);
});
</script>
